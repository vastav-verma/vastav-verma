      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="700" height="280" rx="14" fill="url(#termbg)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="700" height="36" rx="14" fill="#161b22"/>
