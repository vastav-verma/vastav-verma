  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="350" y="23" font-family="Fira Code, monospace" font-size="12" fill="#8b949e" text-anchor="middle">vastav@portfolio: ~</text>

  <g font-family="Fira Code, monospace" font-size="16" fill="#c9d1d9">
    <text x="24" y="70"><tspan fill="#58a6ff">$</tspan> whoami</text>
    <text x="24" y="98" fill="#a371f7">Vastav Verma — Software Engineer · Data Scientist</text>

    <text x="24" y="132"><tspan fill="#58a6ff">$</tspan> cat experience.log</text>
    <text x="24" y="160" fill="#7ee787">CBSOT → Sacred Mind Infotech → Ducat India → Google</text>

