<svg width="520" height="300" viewBox="0 0 520 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="blueGrad" x1="80" y1="40" x2="430" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="150" y1="80" x2="390" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A371F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <style>
      .label {
        font-family: monospace;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .small {
        font-family: monospace;
        font-size: 10px;
        letter-spacing: 1px;
      }

      .code {
        font-family: monospace;
        font-size: 9px;
      }
    </style>
  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND GLOW -->
  <!-- ========================= -->

  <circle cx="260" cy="145" r="95"
          fill="#58A6FF"
          opacity="0.045"
          filter="url(#glowSoft)"/>

  <circle cx="385" cy="70" r="55"
          fill="#A371F7"
          opacity="0.035"
          filter="url(#glowSoft)"/>


  <!-- ========================= -->
  <!-- FLOATING CODE CARD -->
  <!-- ========================= -->

  <g transform="translate(40 48) rotate(-5 85 55)">

    <rect x="0" y="0" width="170" height="105" rx="12"
          fill="#0D1117"
          stroke="#21262D"
          stroke-width="1.5"/>

    <rect x="0" y="0" width="170" height="26" rx="12"
          fill="#161B22"/>

    <circle cx="17" cy="13" r="4" fill="#FF7B54"/>
    <circle cx="31" cy="13" r="4" fill="#F2C811"/>
    <circle cx="45" cy="13" r="4" fill="#3FB950"/>

    <text x="15" y="48" class="code" fill="#8B949E">
      const project =
    </text>

    <text x="15" y="64" class="code" fill="#58A6FF">
      buildSomething();
    </text>

    <text x="15" y="82" class="code" fill="#A371F7">
      AI + Software
    </text>

    <text x="15" y="98" class="code" fill="#8B949E">
      // iterate...
    </text>

  </g>


  <!-- ========================= -->
  <!-- CENTRAL LAPTOP -->
  <!-- ========================= -->

  <g transform="translate(135 72)">

    <!-- Screen -->
    <rect x="0" y="0" width="255" height="155" rx="13"
          fill="#0D1117"
          stroke="url(#blueGrad)"
          stroke-width="2"/>

    <!-- Screen Header -->
    <rect x="0" y="0" width="255" height="28" rx="13"
          fill="#161B22"/>

    <circle cx="17" cy="14" r="4" fill="#FF7B54"/>
    <circle cx="31" cy="14" r="4" fill="#F2C811"/>
    <circle cx="45" cy="14" r="4" fill="#3FB950"/>

    <text x="70" y="18"
          class="small"
          fill="#8B949E">
      project-lab
    </text>

    <!-- Code lines -->

    <text x="18" y="52"
          class="code"
          fill="#A371F7">
      &lt;Build
    </text>

    <text x="68" y="52"
          class="code"
          fill="#58A6FF">
      AIProject
    </text>

    <text x="130" y="52"
          class="code"
          fill="#8B949E">
      /&gt;
    </text>

    <rect x="18" y="63" width="130" height="5" rx="2"
          fill="#21262D"/>

    <rect x="18" y="76" width="185" height="5" rx="2"
          fill="#21262D"/>

    <rect x="18" y="89" width="105" height="5" rx="2"
          fill="#21262D"/>

    <!-- highlighted line -->
    <rect x="18" y="105" width="155" height="7" rx="3"
          fill="#58A6FF"
          opacity="0.18"/>

    <rect x="18" y="106" width="78" height="5" rx="2"
          fill="#58A6FF"
          opacity="0.75"/>

    <rect x="18" y="121" width="115" height="5" rx="2"
          fill="#A371F7"
          opacity="0.65"/>

    <!-- Cursor -->
    <rect x="138" y="119" width="2" height="9"
          fill="#58A6FF"
          filter="url(#glowBlue)">
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1.2s"
        repeatCount="indefinite"/>
    </rect>

    <!-- Laptop Base -->
    <path d="M-18 158
             L273 158
             L291 181
             Q294 187 285 187
             L-30 187
             Q-39 187 -36 181
             Z"
          fill="#161B22"
          stroke="#30363D"
          stroke-width="1.5"/>

    <rect x="98" y="168" width="60" height="5"
          rx="2.5"
          fill="#30363D"/>

  </g>


  <!-- ========================= -->
  <!-- AI NODE -->
  <!-- ========================= -->

  <g>

    <circle cx="438" cy="82" r="28"
            fill="#0D1117"
            stroke="url(#purpleGrad)"
            stroke-width="2"
            filter="url(#glowBlue)"/>

    <circle cx="438" cy="82" r="8"
            fill="#A371F7"/>

    <circle cx="438" cy="82" r="4"
            fill="#0D1117"/>

    <!-- Neural connections -->

    <line x1="438" y1="54" x2="438" y2="40"
          stroke="#58A6FF"
          stroke-width="1.5"/>

    <line x1="464" y1="82" x2="478" y2="82"
          stroke="#A371F7"
          stroke-width="1.5"/>

    <line x1="458" y1="62" x2="469" y2="51"
          stroke="#58A6FF"
          stroke-width="1.5"/>

    <circle cx="438" cy="40" r="3"
            fill="#58A6FF"/>

    <circle cx="478" cy="82" r="3"
            fill="#A371F7"/>

    <circle cx="469" cy="51" r="3"
            fill="#58A6FF"/>

  </g>


  <!-- ========================= -->
  <!-- FLOATING TAGS -->
  <!-- ========================= -->

  <g transform="translate(355 215)">

    <rect width="65" height="25" rx="12"
          fill="#161B22"
          stroke="#30363D"/>

    <circle cx="13" cy="12.5" r="3"
            fill="#58A6FF"/>

    <text x="23" y="16"
          class="small"
          fill="#C9D1D9">
      AI
    </text>

  </g>


  <g transform="translate(425 215)">

    <rect width="65" height="25" rx="12"
          fill="#161B22"
          stroke="#30363D"/>

    <circle cx="13" cy="12.5" r="3"
            fill="#A371F7"/>

    <text x="23" y="16"
          class="small"
          fill="#C9D1D9">
      RAG
    </text>

  </g>


  <!-- ========================= -->
  <!-- BUILD → DEPLOY → ITERATE -->
  <!-- ========================= -->

  <g transform="translate(82 258)">

    <text x="0" y="0"
          class="label"
          font-size="11"
          fill="#58A6FF">
      BUILD
    </text>

    <text x="62" y="0"
          class="label"
          font-size="11"
          fill="#484F58">
      →
    </text>

    <text x="82" y="0"
          class="label"
          font-size="11"
          fill="#A371F7">
      DEPLOY
    </text>

    <text x="160" y="0"
          class="label"
          font-size="11"
          fill="#484F58">
      →
    </text>

    <text x="180" y="0"
          class="label"
          font-size="11"
          fill="#58A6FF">
      ITERATE
    </text>

  </g>


  <!-- ========================= -->
  <!-- DECORATIVE DOTS -->
  <!-- ========================= -->

  <circle cx="72" cy="190" r="2" fill="#58A6FF" opacity="0.7"/>
  <circle cx="91" cy="202" r="1.5" fill="#A371F7" opacity="0.7"/>
  <circle cx="470" cy="145" r="2" fill="#58A6FF" opacity="0.7"/>
  <circle cx="452" cy="160" r="1.5" fill="#A371F7" opacity="0.7"/>

</svg>
